<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTIMATO // SYSTEM CONTROL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #09090b; /* Deep gloomy black-blue */
            color: #d1d5db;
            min-height: 100vh;
        }
        .doom-font {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
        }
        .card {
            background: rgba(15, 15, 20, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }
        .input-field {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e5e7eb;
            transition: all 0.2s ease;
        }
        .input-field:focus {
            border-color: #22c55e;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.1);
        }
        .btn-glow {
            background: #052e16;
            color: #4ade80;
            border: 1px solid #14532d;
            transition: all 0.3s;
        }
        .btn-glow:hover {
            background: #14532d;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
        }
        .log-container {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        /* Tab functionality */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-btn.active {
            color: #22c55e;
            border-bottom: 2px solid #22c55e;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center">
    <div class="w-full max-w-4xl">
        
        <div class="card rounded-xl p-8 mb-6 text-center">
            <h1 class="doom-font text-4xl text-white mb-2 tracking-[0.2em]">ULTIMATO</h1>
            <p class="text-gray-500 text-xs uppercase tracking-widest font-medium">Internal System Dashboard // v2.0</p>
        </div>

        <div class="flex gap-4 mb-6 justify-center">
            <button onclick="showTab('overview')" id="btn-overview" class="tab-btn active px-4 py-2 text-sm font-medium transition-all">OVERVIEW</button>
            <button onclick="showTab('keygen')" id="btn-keygen" class="tab-btn px-4 py-2 text-sm font-medium transition-all">LICENSE GEN</button>
            <button onclick="showTab('logs')" id="btn-logs" class="tab-btn px-4 py-2 text-sm font-medium transition-all">SYSTEM LOGS</button>
        </div>

        <div id="overview" class="tab-content active">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="card rounded-xl p-6 text-center">
                    <div class="text-gray-500 text-[10px] uppercase tracking-tighter mb-1">Active Users</div>
                    <div class="text-3xl font-bold text-white" id="total-users">0</div>
                </div>
                <div class="card rounded-xl p-6 text-center">
                    <div class="text-gray-500 text-[10px] uppercase tracking-tighter mb-1">Stock Licenses</div>
                    <div class="text-3xl font-bold text-white" id="unused-keys">0</div>
                </div>
                <div class="card rounded-xl p-6 text-center">
                    <div class="text-gray-500 text-[10px] uppercase tracking-tighter mb-1">System Status</div>
                    <div class="text-xl font-bold text-green-500 doom-font">ONLINE</div>
                </div>
            </div>
        </div>

        <div id="keygen" class="tab-content">
            <div class="card rounded-xl p-8 max-w-md mx-auto">
                <h2 class="doom-font text-sm text-green-500 mb-6 uppercase tracking-widest text-center">Generate License</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-gray-500 text-[10px] uppercase mb-2 ml-1">Key Prefix</label>
                        <input type="text" id="prefix" placeholder="e.g., PREMIUM" class="input-field w-full p-3 rounded-lg text-sm">
                    </div>
                    <button onclick="generateKey()" class="btn-glow w-full p-3 rounded-lg text-sm font-bold doom-font tracking-widest">
                        GENERATE
                    </button>
                    <div id="new-key-display" class="hidden mt-4 p-4 bg-green-500/10 border border-green-500/20 rounded-lg text-center">
                        <span class="text-xs text-green-500 block mb-1 font-bold">NEW LICENSE KEY:</span>
                        <code class="text-white text-lg font-bold select-all" id="key-result"></code>
                    </div>
                </div>
            </div>
        </div>

        <div id="logs" class="tab-content">
            <div class="card rounded-xl p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="doom-font text-xs text-gray-400 uppercase tracking-widest font-bold">Telemetry Feed</h2>
                    <span class="text-[10px] text-green-500 animate-pulse">● LIVE_FEED</span>
                </div>
                <div class="log-container rounded-lg h-80 overflow-y-auto p-4 text-[11px] leading-relaxed" id="log-feed">
                    <div class="text-gray-600 italic">No activity recorded...</div>
                </div>
            </div>
        </div>

        <div class="mt-12 text-center text-[10px] text-gray-600 uppercase tracking-[0.3em]">
            Connection Secure // AES-256 Encrypted
        </div>
    </div>

    <script>
        const SECRET = "f1a3b8d6e9c2a5f8b0d3e6a9c1f4b7d0e3a6f9c2b5e8a1d4f7"; // THE DANRAYSHAINA HASH

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.getElementById('btn-' + tabId).classList.add('active');
        }

        async function refreshData() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                
                document.getElementById('total-users').innerText = data.userCount || 0;
                document.getElementById('unused-keys').innerText = data.keyCount || 0;
                
                const feed = document.getElementById('log-feed');
                if (data.recentLogs && data.recentLogs.length > 0) {
                    feed.innerHTML = data.recentLogs.map(log => `
                        <div class="mb-2 border-b border-white/5 pb-2">
                            <span class="text-green-800">[${new Date(log.created_at).toLocaleTimeString()}]</span>
                            <span class="text-gray-400 ml-2">${log.username}</span>
                            <span class="text-white ml-2">→ ${log.event}</span>
                        </div>
                    `).join('');
                }
            } catch (e) { console.log("Fetch Error"); }
        }

        async function generateKey() {
            const prefix = document.getElementById('prefix').value || "ULT";
            const rand = Math.random().toString(36).substring(2, 12).toUpperCase();
            const finalKey = `${prefix}-${rand}`;
            
            try {
                const res = await fetch('/api/admin/generate-key', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ auth: SECRET, key_id: finalKey })
                });

                if (res.ok) {
                    document.getElementById('new-key-display').classList.remove('hidden');
                    document.getElementById('key-result').innerText = finalKey;
                    refreshData();
                }
            } catch (e) { alert("API Error"); }
        }

        setInterval(refreshData, 10000);
        refreshData();
    </script>
</body>
</html>
