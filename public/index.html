<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTIMATO // SYSTEM_CONTROL</title>
    <style>
        :root {
            --bg: #050505;
            --surface: #0d0d0d;
            --border: #1a1a1a;
            --accent: #00ff41;
            --text-main: #e0e0e0;
            --text-dim: #666;
            --danger: #ff3e3e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            font-family: 'Courier New', Courier, monospace; 
            padding: 20px;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .glitch { font-size: 1.5rem; font-weight: bold; letter-spacing: 5px; color: var(--accent); text-shadow: 2px 0 var(--border); }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
        
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 20px;
            text-align: center;
        }

        .stat-val { display: block; font-size: 2rem; color: var(--accent); font-weight: bold; }
        .stat-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

        .main-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 20px;
        }

        .card h2 { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 20px; border-left: 3px solid var(--accent); padding-left: 10px; }

        input {
            background: #000;
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 12px;
            width: 100%;
            margin-bottom: 15px;
            outline: none;
            font-family: inherit;
        }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover { background: #00cc33; }

        .log-feed {
            height: 400px;
            overflow-y: auto;
            background: #000;
            padding: 15px;
            font-size: 0.75rem;
            border: 1px solid var(--border);
        }

        .log-entry { margin-bottom: 8px; border-bottom: 1px solid #111; padding-bottom: 4px; }
        .log-ts { color: var(--text-dim); }
        .log-user { color: var(--accent); font-weight: bold; }
        .log-ev { color: #fff; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="glitch">ULTIMATO_CMD</div>
        <div style="font-size: 0.7rem; color: var(--text-dim);">STATUS: <span style="color: var(--accent);" id="sys-status">STABLE</span></div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-val" id="total-users">0</span>
            <span class="stat-label">Authorized_Users</span>
        </div>
        <div class="stat-card">
            <span class="stat-val" id="unused-keys">0</span>
            <span class="stat-label">Available_Licenses</span>
        </div>
        <div class="stat-card">
            <span class="stat-val" style="color: var(--danger);">LIVE</span>
            <span class="stat-label">Panel_Environment</span>
        </div>
    </div>

    <div class="main-grid">
        <div class="card">
            <h2>Key_Generation</h2>
            <input type="text" id="prefix" placeholder="PREFIX (e.g. LIFETIME)">
            <button onclick="generateKey()">Create_License</button>
            <div id="new-key-display" style="margin-top: 20px; color: var(--accent); text-align: center; font-size: 1.1rem; word-break: break-all; font-weight: bold;"></div>
        </div>

        <div class="card">
            <h2>System_Logs</h2>
            <div class="log-feed" id="log-feed">
                <div class="log-entry">Waiting for telemetry data...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const SECRET = "f1a3b8d6e9c2a5f8b0d3e6a9c1f4b7d0e3a6f9c2b5e8a1d4f7b0c3e6a9d2f5b8"; // CHANGE THIS TO MATCH YOUR .ENV

    async function refreshData() {
        try {
            const res = await fetch('/api/stats');
            if (!res.ok) throw new Error();
            const data = await res.json();
            
            document.getElementById('total-users').innerText = data.userCount || 0;
            document.getElementById('unused-keys').innerText = data.keyCount || 0;
            document.getElementById('sys-status').innerText = "STABLE";
            document.getElementById('sys-status').style.color = "var(--accent)";
            
            const feed = document.getElementById('log-feed');
            if (data.recentLogs && data.recentLogs.length > 0) {
                feed.innerHTML = data.recentLogs.map(log => `
                    <div class="log-entry">
                        <span class="log-ts">[${new Date(log.created_at).toLocaleTimeString()}]</span>
                        <span class="log-user">${log.username}</span>: 
                        <span class="log-ev">${log.event}</span>
                    </div>
                `).join('');
            }
        } catch (e) {
            document.getElementById('sys-status').innerText = "DISCONNECTED";
            document.getElementById('sys-status').style.color = "var(--danger)";
        }
    }

    async function generateKey() {
        const prefix = document.getElementById('prefix').value || "ULT";
        const rand = Math.random().toString(36).substring(2, 12).toUpperCase();
        const finalKey = `${prefix}-${rand}`;
        
        try {
            const res = await fetch('/api/admin/generate-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ auth: SECRET, key_id: finalKey })
            });

            if (res.ok) {
                document.getElementById('new-key-display').innerText = finalKey;
                refreshData();
            } else {
                alert("Unauthorized: Key Mismatch");
            }
        } catch (e) {
            alert("Connection Error");
        }
    }

    setInterval(refreshData, 5000);
    refreshData();
</script>

</body>
</html>
